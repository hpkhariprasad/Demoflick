<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy — sample app</title>
<style>
  :root { --bg:#f4f5f9; --card:#fff; --ink:#1b1e28; --mute:#7a8194; --line:#e6e8ef; --brand:#6c4cf5; --done:#b3b8c7; }
  :root.dark { --bg:#12141c; --card:#1c1f2b; --ink:#eef0f6; --mute:#8f96a8; --line:#2b2f3e; --done:#5a6072; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, "Segoe UI", sans-serif; transition: background .25s, color .25s; }
  header { display:flex; align-items:center; justify-content:space-between; padding:22px 48px; }
  .logo { font-weight:800; font-size:22px; letter-spacing:-.02em; }
  .logo span { color:var(--brand); }
  #theme { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:9px 18px; font:inherit; font-weight:600; cursor:pointer; }
  main { max-width:760px; margin:10px auto 0; padding:0 24px; }
  h1 { font-size:38px; letter-spacing:-.03em; margin:0 0 6px; }
  .sub { color:var(--mute); margin:0 0 22px; }
  .track { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:24px; }
  #bar { height:100%; width:0; background:var(--brand); border-radius:99px; transition:width .45s cubic-bezier(.2,.8,.2,1); }
  form { display:flex; gap:10px; margin-bottom:18px; }
  #new { flex:1; padding:15px 18px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; outline:none; }
  #new:focus { border-color:var(--brand); box-shadow:0 0 0 4px rgba(108,76,245,.16); }
  #add { padding:0 26px; border:0; border-radius:14px; background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { border:0; background:transparent; color:var(--mute); font:inherit; font-weight:600; padding:8px 16px; border-radius:99px; cursor:pointer; }
  .tabs button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  li { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 18px; animation:pop .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { opacity:0; transform:translateY(-8px) scale(.98); } }
  .check { width:24px; height:24px; border-radius:50%; border:2px solid var(--done); background:transparent; cursor:pointer; flex:none; display:grid; place-items:center; color:#fff; font-size:14px; padding:0; }
  li.done .check { background:var(--brand); border-color:var(--brand); }
  li.done .text { color:var(--done); text-decoration:line-through; }
  .tag { margin-left:auto; font-size:13px; font-weight:600; color:var(--brand); background:rgba(108,76,245,.12); padding:4px 10px; border-radius:99px; }
</style>
<body>
<header>
  <div class="logo">tidy<span>.</span></div>
  <button id="theme" aria-label="Toggle theme">Dark mode</button>
</header>
<main>
  <h1>Today</h1>
  <p class="sub"><span id="count"></span></p>
  <div class="track"><div id="bar"></div></div>
  <form id="form">
    <input id="new" placeholder="Add a task…" autocomplete="off">
    <button id="add">Add</button>
  </form>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="open">Open</button>
    <button data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
</main>
<script>
  let tasks = [
    { text: 'Review the pull request', tag: 'Work', done: true },
    { text: 'Book train tickets', tag: 'Travel', done: false },
    { text: 'Water the plants', tag: 'Home', done: false },
  ];
  let filter = 'all';
  const list = document.getElementById('list');
  function draw(animateLast) {
    const shown = tasks.filter((t) => filter === 'all' || (filter === 'done') === t.done);
    list.innerHTML = '';
    shown.forEach((t) => {
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      if (!(animateLast && t === tasks[0])) li.style.animation = 'none';
      li.innerHTML = `<button class="check" aria-label="Complete ${t.text}">${t.done ? '✓' : ''}</button>
        <span class="text"></span><span class="tag"></span>`;
      li.querySelector('.text').textContent = t.text;
      li.querySelector('.tag').textContent = t.tag;
      li.querySelector('.check').onclick = () => { t.done = !t.done; draw(); };
      list.appendChild(li);
    });
    const done = tasks.filter((t) => t.done).length;
    document.getElementById('count').textContent = `${done} of ${tasks.length} tasks done`;
    document.getElementById('bar').style.width = (tasks.length ? (done / tasks.length) * 100 : 0) + '%';
  }
  document.getElementById('form').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('new');
    if (!input.value.trim()) return;
    tasks.unshift({ text: input.value.trim(), tag: 'New', done: false });
    input.value = '';
    draw(true);
  };
  document.getElementById('tabs').onclick = (e) => {
    if (!e.target.dataset.f) return;
    filter = e.target.dataset.f;
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b === e.target));
    draw();
  };
  document.getElementById('theme').onclick = (e) => {
    const dark = document.documentElement.classList.toggle('dark');
    e.target.textContent = dark ? 'Light mode' : 'Dark mode';
  };
  draw();
</script>
</body>
</html>
