name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web app (all formats)
        uses: ./
        with:
          storyboard: test/web.json
          formats: landscape,vertical,square,gif
          output: out-web

      - name: Terminal
        uses: ./
        with:
          storyboard: test/terminal.json
          formats: landscape
          output: out-terminal

      - name: Check outputs
        shell: bash
        run: |
          for f in out-web/demo.mp4 out-web/demo-vertical.mp4 out-web/demo-square.mp4 out-web/demo.gif out-terminal/demo.mp4; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ matrix.os }}
          path: |
            out-*/demo*
            out-*/contact-*.jpg
            out-*/failure.png
